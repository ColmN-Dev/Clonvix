<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/clonvix-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clonvix — Explore GitHub" />
    <meta property="og:description" content="Discover GitHub repositories, explore projects, and find developers with Clonvix." />
    <meta property="og:image" content="https://clonvix.onrender.com/clonvix-hero.png" />
    <meta property="og:url" content="https://clonvix.onrender.com/" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clonvix — Explore GitHub" />
    <meta name="twitter:description" content="Discover GitHub repositories, explore projects, and find developers with Clonvix." />
    <meta name="twitter:image" content="https://clonvix.onrender.com/clonvix-hero.png" />
    
    <title>Clonvix</title>
    <script>
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
