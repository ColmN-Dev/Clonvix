name: Collect Trending Snapshots

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  collect-snapshots:
    name: Collect Repository Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SSL: "True"
      GITHUB_API_TOKEN: ${{ secrets.CLONVIX_GITHUB_API_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect repository snapshots
        working-directory: src/backend
        run: python manage.py snapshots

      - name: Cleanup repository snapshots
        working-directory: src/backend
        run: python manage.py cleanup_snapshots